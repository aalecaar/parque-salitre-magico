<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <title>Atracciones Disponibles</title>
  <meta charset="UTF-8">
  <th:block th:replace="fragments/styles :: styles" />
</head>

<body>
  <div class="container">
    <h1>Atracciones Disponibles en <span th:text="${estacion.nombre}"></span></h1>
    <p>Estado de la estación:
      <span th:text="${estacion.habilitada ? 'Habilitada' : 'Deshabilitada'}"
        th:class="${estacion.habilitada ? 'status-enabled' : 'status-disabled'}">
      </span>
    </p>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Estatura Mínima</th>
          <th>Descripción</th>
          <th>Clasificación</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="atraccion : ${atracciones}">
          <td th:text="${atraccion.nombre}"></td>
          <td th:text="${atraccion.estaturaMinima + ' cm'}"></td>
          <td th:text="${atraccion.descripcion}"></td>
          <td th:text="${atraccion.clasificacion}"></td>
        </tr>
      </tbody>
    </table>

    <div th:if="${atracciones.empty}" class="info-message">
      <p>No hay atracciones disponibles en este momento.</p>
    </div>

    <div class="button-group">
      <a class="button-link" th:href="@{/estaciones}">Volver a Estaciones</a>
      <a class="button-link" th:href="@{/}">Volver al Inicio</a>
    </div>
  </div>
</body>

</html>
