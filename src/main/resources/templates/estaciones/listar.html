<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <title>Lista de Estaciones</title>
  <meta charset="UTF-8">
  <th:block th:replace="fragments/styles :: styles" />
</head>

<body>
  <div class="container">
    <h1>Listado de Estaciones</h1>

    <div th:if="${error}" class="error-message">
      <p th:text="${error}"></p>
    </div>

    <div th:if="${session.empleadoSeleccionado}" class="info-message">
      Empleado actual: <span th:text="${session.empleadoSeleccionado.nombre}"></span>
      (<span th:text="${session.empleadoSeleccionado.cargo}"></span>)
    </div>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Estado</th>
          <th>Acciones</th>
          <th>Atracciones Disponibles</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="estacion : ${estaciones}">
          <td th:text="${estacion.nombre}"></td>
          <td th:text="${estacion.habilitada ? 'Habilitada' : 'Deshabilitada'}"
            th:class="${estacion.habilitada ? 'status-enabled' : 'status-disabled'}">
          </td>
          <td>
            <form th:if="${!estacion.habilitada}" th:action="@{/estaciones/{id}/habilitar(id=${estacion.id})}"
              method="post" style="display: inline;">
              <button type="submit" class="button-primary">Habilitar</button>
            </form>
            <form th:if="${estacion.habilitada}" th:action="@{/estaciones/{id}/deshabilitar(id=${estacion.id})}"
              method="post" style="display: inline;">
              <button type="submit" class="button-warning">Deshabilitar</button>
            </form>
          </td>
          <td>
            <a th:href="@{/estaciones/{id}/atracciones(id=${estacion.id})}" class="button-link">Ver Atracciones</a>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="button-group">
      <a th:if="${error}" class="button-link" th:href="@{/empleados}">Seleccionar otro empleado</a>
      <a class="button-link" th:href="@{/}">Volver al inicio</a>
    </div>
  </div>
</body>

</html>
