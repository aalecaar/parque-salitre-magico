<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <title>Visitas a las atracciones</title>
  <meta charset="UTF-8">
  <th:block th:replace="fragments/styles :: styles" />
</head>

<body>
  <div class="container">
    <h1>Visitas a las atracciones</h1>

    <table>
      <thead>
        <tr>
          <th>Atracción</th>
          <th>Número de Visitas</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="visita : ${visitasAtracciones}">
          <td th:text="${visita.key.nombre}"></td>
          <td th:text="${visita.value}"></td>
        </tr>
      </tbody>
    </table>

    <a class="button-link" th:href="@{/}">Volver al inicio</a>
  </div>
</body>

</html>
